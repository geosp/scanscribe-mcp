[project]
name = "scanscribe-mcp"
version = "0.1.0"
description = "MCP server that OCRs scanned PDFs and page-image folders into page-marked text with scanscribe, on the GPU when available."
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6",
    "ruff>=0.8",
]

[build-system]
# The range follows the uv version CI pins (UV_VERSION in .github/workflows/ci.yml).
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scanscribe_mcp"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["scanscribe_mcp"]
mypy_path = "src"

# A dependency without type information (no py.typed marker), or one installed
# only with an optional extra, needs an override like this:
# [[tool.mypy.overrides]]
# module = ["untyped_package", "untyped_package.*"]
# ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_ci_gate.py imports the CI gate script directly.
pythonpath = [".github/scripts"]
